# Unit tests, bridge tests and the production build. No secrets, no browser, no simulator.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest  # the project is tested on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Web dependencies
        working-directory: web
        run: npm ci
      - name: Web unit tests
        working-directory: web
        run: npm test
      - name: Type check and build
        working-directory: web
        run: npm run build
      - name: Bridge tests
        run: |
          python -m pip install -r bridge/requirements.txt
          python -m pytest bridge/tests -q
